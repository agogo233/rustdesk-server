version: '3'

networks:
  rustdesk-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - 31115:31115
      - 31116:31116
      - 31116:31116/udp
      - 31118:31118
    image: ghcr.io/rustdesk/rustdesk-server:latest-non-s6
    command: hbbs -r rustdesk.example.com:31117
    volumes:
      - ./data:/data
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - 31117:31117
      - 31119:31119
    image: ghcr.io/rustdesk/rustdesk-server:latest-non-s6
    command: hbbr
    volumes:
      - ./data:/data
    networks:
      - rustdesk-net
    restart: unless-stopped
