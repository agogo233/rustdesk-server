name: build

permissions:
  contents: read
  packages: write

on:
  push:

  workflow_dispatch:

jobs:
  build:
    name: Build - amd64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          target: x86_64-unknown-linux-musl

      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl

      - run: cargo build --release --target=x86_64-unknown-linux-musl

      - run: chmod -v a+x target/x86_64-unknown-linux-musl/release/*

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: |
            target/x86_64-unknown-linux-musl/release/hbbr
            target/x86_64-unknown-linux-musl/release/hbbs
            target/x86_64-unknown-linux-musl/release/rustdesk-utils
          if-no-files-found: error

  docker:
    name: Docker push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: docker/rootfs/usr/bin

      - run: chmod -v a+x docker/rootfs/usr/bin/*

      - name: Set lowercase image name
        run: |
          LOWER_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_NAME=$LOWER_NAME" >> $GITHUB_ENV

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_NAME }}:latest
          provenance: false

      - name: Show Docker image size
        run: |
          docker images ghcr.io/${{ env.LOWER_NAME }}:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'

  docker-non-s6:
    name: Docker push (non-s6)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: docker-non-s6/bin

      - run: chmod -v a+x docker-non-s6/bin/*

      - name: Set lowercase image name
        run: |
          LOWER_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWER_NAME=$LOWER_NAME" >> $GITHUB_ENV

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ./docker-non-s6
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_NAME }}:latest-non-s6
          provenance: false

      - name: Show Docker image size
        run: |
          docker images ghcr.io/${{ env.LOWER_NAME }}:latest-non-s6 --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'
